<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Explore Nature</title>
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<!-- Navigation section -->
<nav>
    <div class="logo">Bornfire</div>
    <div>
        <a href="home.html" target="_blank">Home</a>
        <a href="about.html" target="_blank">Destinations</a>
        <a href="contact.html" target="_blank">Contact Us</a>
        <a href="services.html" target="_blank">Services</a>
    </div>
</nav>
  <!-- Hero Section --> 
   <section class="hero-contact">
        <div>
            <h1>Contact Us</h1>
            <p>We would love to hear from you! Please fill out the form below and we will get back to you as soon as possible.</p>
        </div>
    </section>

<!-- Main Section -->
<section class="sec">
    <div class="left"> 
        <img src="https://images.unsplash.com/photo-1497215728101-856f4ea42174?w=700&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="Contact Us">
        <h2>Get in Touch</h2>
        <p>Please get in touch via:</p>
        <ul>
            <li>Email: info@explore nature.com</li>
            <li>Phone: +254 700 000 000</li>
        </ul>
    </div>
    <div class="right">
        <form> 
            <label class="form-label" for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" required>
            <label class="form-label" for="phone">Phone Number:</label>
            <input placeholder="+254 700 000 000" type="tel" id="phone" name="phone" required>
            <label class="form-label" for="email">Email:</label>
            <input placeholder="your.email@example.com" type="email" id="email" name="email" required>
            <label class="form-label" for="suggestion">Suggestions:</label>
            <textarea id="suggestion" name="suggestion" rows="3.5"></textarea> <br><br>

            <button type="submit" value="Submit">Submit</button>
        </form>

    </div>
</section>
</body>
</html>
